<!DOCTYPE html>
<html>
<head>
    <title>Interactive Buttons</title>
</head>

<body>

<h2>Interactive Buttons</h2>

<button onclick="changeText()">Click Me</button>

<p id="text">Hello User</p>

<script>
function changeText() {
    document.getElementById("text").innerHTML = "Button Clicked!";
}
</script>

</body>
</html>
